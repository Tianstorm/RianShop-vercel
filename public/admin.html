<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RianShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #0f172a; color: #f8fafc; } </style>
</head>
<body class="p-4 max-w-xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h1 class="text-xl font-bold text-indigo-400">Admin Dashboard RianShop</h1>
        <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1.5 rounded-lg font-semibold">Logout</button>
    </div>

    <div class="bg-slate-800 p-4 rounded-xl space-y-3">
        <h3 class="font-bold text-md text-indigo-300">Pengaturan Gateway & API Keys</h3>
        <div>
            <label class="text-xs text-gray-400">Casaku Merchant ID (qr_id):</label>
            <input type="text" id="merchant_id" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-400">Casaku License Key (API Key):</label>
            <input type="text" id="api_key" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-400">Atlantic H2H API Key:</label>
            <input type="text" id="atlantic_key" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-400">URL Direct File Musik (.mp3):</label>
            <input type="text" id="bg_music" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <button onclick="saveSettings()" class="w-full py-2 bg-emerald-600 font-bold rounded-lg text-sm">Simpan Pengaturan</button>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');

        async function loadSettings() {
            const res = await fetch('/api/admin/settings', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const config = await res.json();
            if (config.merchant_id) document.getElementById('merchant_id').value = config.merchant_id;
            if (config.api_key) document.getElementById('api_key').value = config.api_key;
            if (config.atlantic_key) document.getElementById('atlantic_key').value = config.atlantic_key;
            if (config.bg_music) document.getElementById('bg_music').value = config.bg_music;
        }

        async function saveSettings() {
            const merchant_id = document.getElementById('merchant_id').value;
            const api_key = document.getElementById('api_key').value;
            const atlantic_key = document.getElementById('atlantic_key').value;
            const bg_music = document.getElementById('bg_music').value;

            const res = await fetch('/api/admin/settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ merchant_id, api_key, atlantic_key, bg_music })
            });
            const data = await res.json();
            alert(data.message || "Pengaturan disimpan!");
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.reload();
        }

        loadSettings();
    </script>
</body>
</html>
