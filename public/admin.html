<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RianShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; } </style>
</head>
<body class="p-4 max-w-xl mx-auto space-y-6 pb-20">

    <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h1 class="text-xl font-bold text-indigo-400">Admin Dashboard RianShop</h1>
        <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1.5 rounded-lg font-semibold hover:bg-red-700">Logout</button>
    </div>

    <!-- Section 1: Tambah Produk Katalog -->
    <div class="bg-slate-800 p-4 rounded-xl space-y-3 border border-gray-700">
        <h3 class="font-bold text-md text-indigo-300 flex items-center gap-2">
            <i class="fa-solid fa-plus-circle"></i> Tambah Produk Katalog
        </h3>
        <input type="text" id="prodName" placeholder="Nama Produk" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        <div class="grid grid-cols-2 gap-2">
            <input type="number" id="prodPrice" placeholder="Harga (Rp)" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
            <input type="number" id="prodStock" placeholder="Stok" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <input type="text" id="prodImage" placeholder="URL Gambar Produk" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        <button onclick="saveProduct()" class="w-full py-2 bg-indigo-600 font-bold rounded-lg text-sm">Simpan Produk</button>
    </div>

    <!-- Section 2: Daftar Produk Katalog -->
    <div class="bg-slate-800 p-4 rounded-xl space-y-3 border border-gray-700">
        <h3 class="font-bold text-md text-indigo-300"><i class="fa-solid fa-boxes-stacked"></i> Daftar Produk Tersedia</h3>
        <div id="adminProductList" class="space-y-2"><p class="text-xs text-gray-400">Memuat produk...</p></div>
    </div>

    <!-- Section 3: MANAJEMEN PLAYLIST MUSIK (TAMBAH LINK / UPLOAD FILE) -->
    <div class="bg-slate-800 p-4 rounded-xl space-y-4 border border-indigo-500/40">
        <h3 class="font-bold text-md text-indigo-300 flex items-center gap-2">
            <i class="fa-solid fa-compact-disc"></i> Manajemen Playlist Musik
        </h3>

        <!-- Option A: Tambah via Link URL -->
        <div class="space-y-2 bg-slate-900/60 p-3 rounded-xl border border-gray-700">
            <p class="text-xs font-semibold text-gray-300">Option 1: Tambah via Link URL Direct MP3</p>
            <input type="text" id="songTitleInput" placeholder="Judul Musik" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-xs">
            <input type="text" id="songUrlInput" placeholder="https://domain.com/music.mp3" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-xs">
            <button onclick="addSongFromUrl()" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded">
                + Tambah via Link URL
            </button>
        </div>

        <!-- Option B: Upload File dari Perangkat HP/PC -->
        <div class="space-y-2 bg-slate-900/60 p-3 rounded-xl border border-gray-700">
            <p class="text-xs font-semibold text-gray-300">Option 2: Upload File Musik dari HP/PC (.mp3)</p>
            <input type="text" id="fileSongTitle" placeholder="Judul Musik (Opsional)" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-xs">
            <input type="file" id="audioFileInput" accept="audio/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white file:font-semibold">
            <button onclick="uploadAudioFile()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded">
                Upload & Tambahkan File
            </button>
        </div>

        <!-- Daftar Urutan Musik saat ini -->
        <div class="space-y-2">
            <p class="text-xs font-bold text-gray-300">Daftar Urutan Musik Aktif (Tampil di Web):</p>
            <div id="adminPlaylist" class="space-y-1.5"></div>
        </div>

        <button onclick="savePlaylistToServer()" class="w-full py-2.5 bg-indigo-600 font-bold rounded-lg text-xs">
            Simpan Urutan Playlist ke Web
        </button>
    </div>

    <!-- Section 4: Pengaturan Keys -->
    <div class="bg-slate-800 p-4 rounded-xl space-y-3 border border-gray-700">
        <h3 class="font-bold text-md text-indigo-300"><i class="fa-solid fa-key"></i> Pengaturan API Keys</h3>
        <div>
            <label class="text-xs text-gray-400">Casaku Merchant ID (qr_id):</label>
            <input type="text" id="merchant_id" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-400">Casaku License Key:</label>
            <input type="text" id="api_key" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-400">Atlantic H2H API Key:</label>
            <input type="text" id="atlantic_key" class="w-full p-2 rounded bg-slate-900 border border-gray-700 text-sm">
        </div>
        <button onclick="saveSettings()" class="w-full py-2 bg-emerald-600 font-bold rounded-lg text-sm">Simpan API Keys</button>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        let currentPlaylist = [];

        async function initAdmin() {
            loadAdminProducts();
            loadSettings();
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/admin/settings', { headers: { 'Authorization': `Bearer ${token}` } });
                const config = await res.json();
                if (config.merchant_id) document.getElementById('merchant_id').value = config.merchant_id;
                if (config.api_key) document.getElementById('api_key').value = config.api_key;
                if (config.atlantic_key) document.getElementById('atlantic_key').value = config.atlantic_key;
                if (config.playlist_data) {
                    currentPlaylist = JSON.parse(config.playlist_data);
                    renderAdminPlaylist();
                }
            } catch(e) {}
        }

        function renderAdminPlaylist() {
            const container = document.getElementById('adminPlaylist');
            if (!currentPlaylist.length) {
                container.innerHTML = '<p class="text-xs text-gray-400">Belum ada musik di playlist.</p>';
                return;
            }
            container.innerHTML = currentPlaylist.map((song, i) => `
                <div class="flex items-center justify-between p-2 rounded bg-slate-900 border border-gray-700 text-xs">
                    <div class="flex items-center gap-2 overflow-hidden pr-2">
                        <span class="font-bold text-indigo-400">${i + 1}.</span>
                        <span class="truncate text-gray-200">${song.title}</span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="moveSong(${i}, -1)" class="px-1.5 py-0.5 glass rounded text-[10px]">▲</button>
                        <button onclick="moveSong(${i}, 1)" class="px-1.5 py-0.5 glass rounded text-[10px]">▼</button>
                        <button onclick="deleteSong(${i})" class="px-2 py-0.5 bg-red-600/80 rounded text-[10px]">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function addSongFromUrl() {
            const title = document.getElementById('songTitleInput').value.trim();
            const url = document.getElementById('songUrlInput').value.trim();
            if (!title || !url) return alert("Isi Judul & URL MP3!");

            currentPlaylist.push({ title, url });
            document.getElementById('songTitleInput').value = '';
            document.getElementById('songUrlInput').value = '';
            renderAdminPlaylist();
        }

        function uploadAudioFile() {
            const fileInput = document.getElementById('audioFileInput');
            const file = fileInput.files[0];
            if (!file) return alert("Pilih file audio terlebih dahulu!");

            let title = document.getElementById('fileSongTitle').value.trim();
            if (!title) title = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentPlaylist.push({ title, url: e.target.result });
                document.getElementById('fileSongTitle').value = '';
                fileInput.value = '';
                renderAdminPlaylist();
                alert("File audio berhasil diunggah ke daftar playlist!");
            };
            reader.readAsDataURL(file);
        }

        function moveSong(index, direction) {
            const target = index + direction;
            if (target < 0 || target >= currentPlaylist.length) return;
            const temp = currentPlaylist[index];
            currentPlaylist[index] = currentPlaylist[target];
            currentPlaylist[target] = temp;
            renderAdminPlaylist();
        }

        function deleteSong(index) {
            currentPlaylist.splice(index, 1);
            renderAdminPlaylist();
        }

        async function savePlaylistToServer() {
            const res = await fetch('/api/admin/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ playlist_data: JSON.stringify(currentPlaylist) })
            });
            const data = await res.json();
            alert(data.message || "Playlist berhasil diperbarui di website!");
        }

        async function loadAdminProducts() {
            const container = document.getElementById('adminProductList');
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                container.innerHTML = products.map(p => `
                    <div class="flex justify-between items-center p-2 rounded bg-slate-900 border border-gray-700 text-xs">
                        <p class="font-bold">${p.name} - Rp ${Number(p.price).toLocaleString('id-ID')}</p>
                        <button onclick="deleteProduct(${p.id})" class="px-2 py-1 bg-red-600 rounded text-[10px]">Hapus</button>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function saveProduct() {
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const stock = document.getElementById('prodStock').value;
            const image = document.getElementById('prodImage').value;

            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, price: Number(price), stock: Number(stock), image })
            });
            const data = await res.json();
            if (data.success) { loadAdminProducts(); alert("Produk Ditambah!"); }
        }

        async function deleteProduct(id) {
            await fetch(`/api/admin/products/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadAdminProducts();
        }

        async function saveSettings() {
            const merchant_id = document.getElementById('merchant_id').value;
            const api_key = document.getElementById('api_key').value;
            const atlantic_key = document.getElementById('atlantic_key').value;

            const res = await fetch('/api/admin/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ merchant_id, api_key, atlantic_key })
            });
            const data = await res.json();
            alert(data.message || "Saved!");
        }

        function logout() { localStorage.removeItem('adminToken'); window.location.reload(); }

        initAdmin();
    </script>
</body>
</html>
