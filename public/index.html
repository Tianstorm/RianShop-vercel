<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RianShop - Digital & PPOB Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="pb-28">

    <header class="glass sticky top-0 z-40 p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> RianShop
        </h1>
        <button id="cartBtn" onclick="toggleCartModal()" class="p-2.5 glass rounded-full relative text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
        </button>
    </header>

    <audio id="bgAudio" loop></audio>

    <main class="max-w-md mx-auto p-4 space-y-5">
        <div class="grid grid-cols-2 gap-2 glass p-1.5 rounded-2xl shadow-md border border-gray-700">
            <button onclick="switchMainNav('produk')" id="nav-btn-produk" class="py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition bg-indigo-600 text-white shadow">
                <i class="fa-solid fa-store"></i> Menu Produk
            </button>
            <button onclick="switchMainNav('topup')" id="nav-btn-topup" class="py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition text-gray-400 hover:text-white">
                <i class="fa-solid fa-wallet"></i> Menu Top Up
            </button>
        </div>

        <section id="main-sec-produk">
            <div id="productGrid" class="grid grid-cols-2 gap-3">
                <p class="col-span-2 text-center text-sm text-gray-400 py-6">Memuat produk...</p>
            </div>
        </section>

        <section id="main-sec-topup" class="hidden space-y-4">
            <div class="grid grid-cols-4 gap-1.5 text-center text-[11px] font-semibold glass p-1.5 rounded-xl border border-gray-800">
                <button onclick="switchTopUpSub('prabayar')" id="subtab-prabayar" class="py-2 rounded-lg bg-indigo-600/30 text-indigo-300 font-bold border border-indigo-500/40">Prabayar</button>
                <button onclick="switchTopUpSub('pascabayar')" id="subtab-pascabayar" class="py-2 rounded-lg text-gray-400 hover:text-white">Pascabayar</button>
                <button onclick="switchTopUpSub('transfer')" id="subtab-transfer" class="py-2 rounded-lg text-gray-400 hover:text-white">Transfer</button>
                <button onclick="switchTopUpSub('deposit')" id="subtab-deposit" class="py-2 rounded-lg text-gray-400 hover:text-white">Deposit</button>
            </div>

            <div id="sub-sec-prabayar" class="glass p-4 rounded-2xl space-y-3">
                <input type="text" id="praTarget" placeholder="Nomor HP / ID Game Target" class="w-full p-2.5 rounded-xl bg-slate-900 border border-gray-700 text-sm">
                <input type="text" id="praCode" placeholder="Kode Produk" class="w-full p-2.5 rounded-xl bg-slate-900 border border-gray-700 text-sm">
                <input type="number" id="praPhone" placeholder="No. WhatsApp Notifikasi" class="w-full p-2.5 rounded-xl bg-slate-900 border border-gray-700 text-sm">
                <button onclick="orderPrabayar()" class="w-full py-2.5 bg-indigo-600 font-bold rounded-xl text-xs">Beli Sekarang</button>
            </div>
        </section>
    </main>

    <!-- FLOATING MUSIC PLAYER (MURNI PLAYLIST DARI ADMIN) -->
    <div id="musicFloatingContainer" class="fixed bottom-4 right-4 z-50 flex flex-col items-end gap-2">
        <div id="musicPanel" class="hidden glass p-3.5 rounded-2xl shadow-2xl w-72 space-y-3 border border-indigo-500/30">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <span class="text-xs font-bold text-indigo-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-compact-disc fa-spin"></i> Music Player
                </span>
                <button onclick="toggleMusicWidget()" class="text-gray-400 hover:text-white text-xs">&times;</button>
            </div>

            <div>
                <p id="currentSongTitle" class="text-xs font-semibold text-gray-200 line-clamp-1">Belum Ada Musik</p>
                <p class="text-[10px] text-gray-400 mt-0.5">RianShop Audio Player</p>
            </div>

            <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl border border-gray-800">
                <button onclick="prevSong()" class="text-xs text-gray-300 hover:text-indigo-400 p-1"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlayPause()" id="playPauseBtn" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full text-xs transition">
                    <i id="playIcon" class="fa-solid fa-play"></i>
                </button>
                <button onclick="nextSong()" class="text-xs text-gray-300 hover:text-indigo-400 p-1"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <div class="space-y-1 max-h-40 overflow-y-auto pr-1">
                <p class="text-[10px] font-bold text-gray-400 mb-1">Daftar Putar:</p>
                <div id="playlistContainer" class="space-y-1"></div>
            </div>
        </div>

        <button onclick="toggleMusicWidget()" class="p-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-2xl border-2 border-indigo-400/50">
            <i class="fa-solid fa-music text-base"></i>
        </button>
    </div>

    <!-- Modal Cart & Checkout -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end justify-center">
        <div class="glass w-full max-w-md rounded-t-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="font-bold text-lg">Detail Checkout</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div id="cartItems" class="space-y-3"></div>
            <input type="number" id="custPhone" placeholder="08xxxxxxxxxx" class="w-full p-2.5 rounded-lg bg-slate-900 border border-gray-700 text-sm">
            <div class="border-t border-gray-700 pt-3 flex justify-between items-center">
                <span class="text-sm font-semibold">Total Pembayaran:</span>
                <span id="totalAmount" class="text-lg font-bold text-indigo-400">Rp 0</span>
            </div>
            <button id="checkoutBtn" onclick="processCheckout()" class="w-full py-3 bg-indigo-600 font-bold rounded-xl">Bayar Sekarang (QRIS)</button>
        </div>
    </div>

    <!-- Modal Display QRIS -->
    <div id="qrisModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-2xl p-6 text-center space-y-4 relative">
            <button onclick="closeQrisModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white">&times;</button>
            <h3 class="font-bold text-lg text-indigo-300">Scan QRIS Untuk Membayar</h3>
            <div class="bg-white p-4 rounded-xl inline-block mx-auto"><canvas id="qrisCanvas"></canvas></div>
            <p id="qrisTotal" class="text-xl font-black text-emerald-400">Rp 0</p>
        </div>
    </div>

    <script>
        let cart = [];
        let pollingInterval = null;
        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;

        async function init() {
            loadPublicSettings();
            loadProducts();
        }

        async function loadPublicSettings() {
            try {
                const res = await fetch('/api/settings/public');
                const data = await res.json();
                if (data.playlist && data.playlist.length) {
                    playlist = data.playlist;
                    changeSong(0);
                } else {
                    document.getElementById('currentSongTitle').innerText = "Playlist Kosong";
                }
            } catch(e) {}
        }

        function toggleMusicWidget() { document.getElementById('musicPanel').classList.toggle('hidden'); }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            if (!playlist.length) {
                container.innerHTML = '<p class="text-[10px] text-gray-400">Belum ada musik dari admin.</p>';
                return;
            }
            container.innerHTML = playlist.map((song, idx) => `
                <button onclick="changeSong(${idx})" class="w-full text-left p-1.5 rounded-lg text-[11px] flex justify-between items-center ${idx === currentTrackIndex ? 'bg-indigo-600/30 text-indigo-300 font-bold' : 'hover:bg-slate-800 text-gray-400'}">
                    <span class="line-clamp-1">${idx + 1}. ${song.title}</span>
                    ${idx === currentTrackIndex && isPlaying ? '<i class="fa-solid fa-volume-high text-[10px]"></i>' : ''}
                </button>
            `).join('');
        }

        function changeSong(index) {
            if (!playlist.length) return;
            currentTrackIndex = index;
            const song = playlist[index];
            const audio = document.getElementById('bgAudio');
            document.getElementById('currentSongTitle').innerText = song.title;
            
            if(song.url) {
                audio.src = song.url;
                if (isPlaying) audio.play();
            }
            renderPlaylist();
        }

        function togglePlayPause() {
            const audio = document.getElementById('bgAudio');
            const icon = document.getElementById('playIcon');
            if (!audio.src) return alert("Belum ada lagu tersedia!");

            if (isPlaying) {
                audio.pause();
                icon.className = "fa-solid fa-play";
            } else {
                audio.play();
                icon.className = "fa-solid fa-pause";
            }
            isPlaying = !isPlaying;
            renderPlaylist();
        }

        function prevSong() {
            if (!playlist.length) return;
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            changeSong(currentTrackIndex);
            if (isPlaying) document.getElementById('bgAudio').play();
        }

        function nextSong() {
            if (!playlist.length) return;
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            changeSong(currentTrackIndex);
            if (isPlaying) document.getElementById('bgAudio').play();
        }

        function switchMainNav(target) {
            if (target === 'produk') {
                document.getElementById('main-sec-produk').classList.remove('hidden');
                document.getElementById('main-sec-topup').classList.add('hidden');
                document.getElementById('nav-btn-produk').className = "py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition bg-indigo-600 text-white shadow";
                document.getElementById('nav-btn-topup').className = "py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition text-gray-400 hover:text-white";
            } else {
                document.getElementById('main-sec-produk').classList.add('hidden');
                document.getElementById('main-sec-topup').classList.remove('hidden');
                document.getElementById('nav-btn-topup').className = "py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition bg-indigo-600 text-white shadow";
                document.getElementById('nav-btn-produk').className = "py-2.5 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition text-gray-400 hover:text-white";
            }
        }

        function switchTopUpSub(subName) {
            ['prabayar', 'pascabayar', 'transfer', 'deposit'].forEach(s => {
                const el = document.getElementById(`sub-sec-${s}`);
                if (el) el.classList.add('hidden');
                document.getElementById(`subtab-${s}`).className = "py-2 rounded-lg text-gray-400 hover:text-white";
            });
            const targetEl = document.getElementById(`sub-sec-${subName}`);
            if (targetEl) targetEl.classList.remove('hidden');
            document.getElementById(`subtab-${subName}`).className = "py-2 rounded-lg bg-indigo-600/30 text-indigo-300 font-bold border border-indigo-500/40";
        }

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                if (!products.length) { grid.innerHTML = '<p class="col-span-2 text-center text-sm text-gray-400 py-6">Belum ada produk.</p>'; return; }
                grid.innerHTML = products.map(p => `
                    <div class="glass p-3 rounded-xl flex flex-col justify-between space-y-2">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-24 object-cover rounded-lg mb-2">
                            <h4 class="font-bold text-sm text-gray-200 line-clamp-1">${p.name}</h4>
                            <p class="text-xs text-indigo-400 font-bold mt-1">Rp ${Number(p.price).toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})" class="w-full py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-xs rounded-lg font-semibold transition mt-2">
                            + Keranjang
                        </button>
                    </div>
                `).join('');
            } catch(e) { grid.innerHTML = '<p class="col-span-2 text-center text-sm text-red-400 py-6">Gagal memuat produk.</p>'; }
        }

        function addToCart(id, name, price) {
            const exist = cart.find(item => item.id === id);
            if (exist) exist.qty++; else cart.push({ id, name, price, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.reduce((acc, curr) => acc + curr.qty, 0);
            document.getElementById('cartItems').innerHTML = cart.map(item => `
                <div class="flex justify-between items-center text-sm glass p-2 rounded-lg">
                    <div>
                        <p class="font-semibold">${item.name}</p>
                        <p class="text-xs text-indigo-400">Rp ${Number(item.price).toLocaleString('id-ID')} x ${item.qty}</p>
                    </div>
                </div>
            `).join('');
            document.getElementById('totalAmount').innerText = `Rp ${cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0).toLocaleString('id-ID')}`;
        }

        function toggleCartModal() { document.getElementById('cartModal').classList.toggle('hidden'); }

        async function processCheckout() {
            const phone = document.getElementById('custPhone').value.trim();
            if (!phone || !cart.length) return alert("Lengkapi data checkout!");
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;

            try {
                const res = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart, phone })
                });
                const data = await res.json();
                if (data.success && data.qr_string) {
                    toggleCartModal();
                    showQrisModal(data.qr_string, data.totalAmount, data.transactionId);
                } else alert(data.message || "Gagal QRIS");
            } catch(e) { alert("Error sistem"); }
            finally { btn.disabled = false; }
        }

        function showQrisModal(qrString, total, transactionId) {
            document.getElementById('qrisTotal').innerText = `Rp ${Number(total).toLocaleString('id-ID')}`;
            QRCode.toCanvas(document.getElementById('qrisCanvas'), qrString, { width: 220 });
            document.getElementById('qrisModal').classList.remove('hidden');
        }

        function closeQrisModal() { document.getElementById('qrisModal').classList.add('hidden'); }

        init();
    </script>
</body>
</html>
