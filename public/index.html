<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RianShop - Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="pb-24">
    <header class="glass sticky top-0 z-40 p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> RianShop
        </h1>
        <button id="cartBtn" class="p-2 glass rounded-full relative text-gray-300 hover:text-white">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <section>
            <h2 class="text-lg font-bold mb-3 text-indigo-300 flex items-center gap-2">
                <i class="fa-solid fa-store"></i> Produk Digital
            </h2>
            <div id="productGrid" class="grid grid-cols-2 gap-3">
                <p class="col-span-2 text-center text-sm text-gray-400 py-6">Memuat produk...</p>
            </div>
        </section>
    </main>

    <!-- Modal Cart & Checkout -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end justify-center">
        <div class="glass w-full max-w-md rounded-t-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="font-bold text-lg">Detail Checkout</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            
            <div id="cartItems" class="space-y-3"></div>

            <div class="space-y-2 pt-2">
                <label class="text-xs text-gray-400">Nomor WhatsApp Penerima:</label>
                <input type="number" id="custPhone" placeholder="08xxxxxxxxxx" class="w-full p-2.5 rounded-lg bg-slate-900 border border-gray-700 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div class="border-t border-gray-700 pt-3 flex justify-between items-center">
                <span class="text-sm font-semibold">Total Pembayaran:</span>
                <span id="totalAmount" class="text-lg font-bold text-indigo-400">Rp 0</span>
            </div>

            <button id="checkoutBtn" onclick="processCheckout()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition">
                Bayar Sekarang (QRIS)
            </button>
        </div>
    </div>

    <!-- Modal Display QRIS & Polling -->
    <div id="qrisModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-2xl p-6 text-center space-y-4 relative">
            <button onclick="closeQrisModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white">&times;</button>
            <h3 class="font-bold text-lg text-indigo-300">Scan QRIS Untuk Membayar</h3>
            <div class="bg-white p-4 rounded-xl inline-block mx-auto">
                <canvas id="qrisCanvas"></canvas>
            </div>
            <p id="qrisTotal" class="text-xl font-black text-emerald-400">Rp 0</p>
            <div class="flex items-center justify-center gap-2 text-xs text-indigo-400 animate-pulse pt-2">
                <i class="fa-solid fa-spinner fa-spin"></i> Menunggu pembayaran kamu...
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let pollingInterval = null;

        async function init() { loadProducts(); }

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                if (!products.length) {
                    grid.innerHTML = '<p class="col-span-2 text-center text-sm text-gray-400 py-6">Belum ada produk.</p>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="glass p-3 rounded-xl flex flex-col justify-between space-y-2">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-24 object-cover rounded-lg mb-2">
                            <h4 class="font-bold text-sm text-gray-200 line-clamp-1">${p.name}</h4>
                            <p class="text-xs text-indigo-400 font-bold mt-1">Rp ${Number(p.price).toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})" class="w-full py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-xs rounded-lg font-semibold transition mt-2">
                            + Keranjang
                        </button>
                    </div>
                `).join('');
            } catch(e) { grid.innerHTML = '<p class="col-span-2 text-center text-sm text-red-400 py-6">Gagal memuat produk.</p>'; }
        }

        function addToCart(id, name, price) {
            const exist = cart.find(item => item.id === id);
            if (exist) { exist.qty++; } else { cart.push({ id, name, price, qty: 1 }); }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.reduce((acc, curr) => acc + curr.qty, 0);
            document.getElementById('cartItems').innerHTML = cart.map(item => `
                <div class="flex justify-between items-center text-sm glass p-2 rounded-lg">
                    <div>
                        <p class="font-semibold">${item.name}</p>
                        <p class="text-xs text-indigo-400">Rp ${Number(item.price).toLocaleString('id-ID')} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${item.id}, -1)" class="px-2 py-0.5 glass rounded">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="px-2 py-0.5 glass rounded">+</button>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            document.getElementById('totalAmount').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
                updateCartUI();
            }
        }

        function toggleCartModal() { document.getElementById('cartModal').classList.toggle('hidden'); }
        document.getElementById('cartBtn').addEventListener('click', toggleCartModal);

        async function processCheckout() {
            const phone = document.getElementById('custPhone').value.trim();
            if (!phone) return alert("Nomor WhatsApp wajib diisi!");
            if (cart.length === 0) return alert("Keranjang belanja kosong!");

            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerText = "Memproses...";

            try {
                const res = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart, phone })
                });
                const data = await res.json();

                if (data.success && data.qr_string) {
                    toggleCartModal();
                    showQrisModal(data.qr_string, data.totalAmount, data.transactionId);
                } else {
                    alert(data.message || "Gagal membuat invoice QRIS.");
                }
            } catch(e) { alert("Terjadi kesalahan sistem."); }
            finally { btn.disabled = false; btn.innerText = "Bayar Sekarang (QRIS)"; }
        }

        function showQrisModal(qrString, total, transactionId) {
            document.getElementById('qrisTotal').innerText = `Rp ${Number(total).toLocaleString('id-ID')}`;
            QRCode.toCanvas(document.getElementById('qrisCanvas'), qrString, { width: 220 }, function (e) { if (e) console.error(e); });
            document.getElementById('qrisModal').classList.remove('hidden');

            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => checkPaymentStatus(transactionId), 3000);
        }

        async function checkPaymentStatus(transactionId) {
            try {
                const res = await fetch('/api/casaku/check-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transactionId })
                });
                const data = await res.json();
                if (data.status && (data.data?.status === 'SUCCESS' || data.data?.status === 'PAID' || data.data?.status === 'paid')) {
                    clearInterval(pollingInterval);
                    alert("PEMBAYARAN BERHASIL! 🎉 Terima kasih telah berbelanja.");
                    cart = [];
                    updateCartUI();
                    closeQrisModal();
                    loadProducts();
                }
            } catch(e) {}
        }

        function closeQrisModal() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('qrisModal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
