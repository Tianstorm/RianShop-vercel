<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RianShop - Top-Up & Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-effect:hover { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <header class="glass sticky top-0 z-40 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="text-xl font-extrabold text-white">RianShop</span>
            </a>

            <div class="flex items-center gap-3">
                <div class="glass px-3 py-1.5 rounded-full flex items-center gap-3 border border-slate-700/60">
                    <button id="musicToggleBtn" onclick="toggleMusic()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center">
                        <i id="musicIcon" class="fa-solid fa-music text-xs"></i>
                    </button>
                    <div class="hidden sm:flex items-center gap-2 pr-1">
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3" oninput="changeVolume(this.value)" class="w-16 h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-indigo-500">
                    </div>
                </div>

                <button id="cartBtn" class="glass relative p-2.5 rounded-full text-slate-300">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <h2 class="text-lg font-bold text-white mb-6"><i class="fa-solid fa-fire text-indigo-400"></i> Katalog Produk</h2>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
            <div class="col-span-full py-12 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Memuat produk...</p></div>
        </div>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex justify-end">
        <div class="glass-card w-full max-w-md h-full p-6 flex flex-col justify-between border-l border-slate-800">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white">Detail Checkout</h2>
                    <button id="closeCartBtn" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400">&times;</button>
                </div>
                <div id="cartItems" class="space-y-3 max-h-[45vh] overflow-y-auto pr-1 mb-6"></div>
                <div class="border-t border-slate-800 pt-4">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nomor WhatsApp Penerima:</label>
                    <input type="number" id="userPhone" placeholder="Contoh: 081234567890" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4 mt-auto">
                <div class="flex justify-between mb-4">
                    <span class="text-xs text-slate-400">Total Pembayaran:</span>
                    <span id="cartTotal" class="text-xl font-extrabold text-indigo-400">Rp 0</span>
                </div>
                <button id="payBtn" onclick="processPayment()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl">Bayar Sekarang (Casaku)</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "";
        let products = [], cart = [];
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicIcon.className = "fa-solid fa-music text-xs text-slate-300";
                musicToggleBtn.classList.remove("bg-indigo-600");
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicIcon.className = "fa-solid fa-compact-disc fa-spin text-xs text-white";
                    musicToggleBtn.classList.add("bg-indigo-600");
                    isPlaying = true;
                });
            }
        }
        function changeVolume(val) { bgMusic.volume = val; }

        async function renderProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const res = await fetch(`/api/products`);
                products = await res.json();
                grid.innerHTML = '';
                products.forEach(p => {
                    const isOutOfStock = p.stock <= 0;
                    grid.innerHTML += `
                        <div class="glass-card rounded-2xl p-5 glow-effect flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-white text-base mb-1">${p.name}</h3>
                                <p class="text-indigo-400 font-extrabold text-lg mb-2">Rp ${p.price.toLocaleString('id-ID')}</p>
                                <p class="text-xs ${isOutOfStock ? 'text-red-400' : 'text-slate-400'} mb-4">Stok: ${p.stock}</p>
                            </div>
                            <button onclick="addToCart(${p.id})" ${isOutOfStock ? 'disabled' : ''} class="w-full ${isOutOfStock ? 'bg-slate-800 text-slate-500' : 'bg-indigo-600 text-white'} font-semibold py-2.5 rounded-xl text-xs">
                                ${isOutOfStock ? 'Stok Habis' : 'Beli Sekarang'}
                            </button>
                        </div>
                    `;
                });
            } catch (e) { grid.innerHTML = `<div class="col-span-full text-center text-red-400 py-6">Gagal memuat produk.</div>`; }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) {
                if (item.qty >= product.stock) return alert("Melebihi stok.");
                item.qty++;
            } else cart.push({ ...product, qty: 1 });
            updateCart();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            let total = 0, count = 0;
            cartItems.innerHTML = '';
            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                cartItems.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl">
                        <div>
                            <h4 class="font-semibold text-white text-xs">${item.name}</h4>
                            <p class="text-xs text-indigo-400 font-bold">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-slate-800 rounded font-bold text-xs">-</button>
                            <span class="text-xs font-bold text-white">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-slate-800 rounded font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cartCount').innerText = count;
            document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        async function processPayment() {
            const phone = document.getElementById('userPhone').value.trim();
            if (cart.length === 0) return alert("Keranjang kosong!");
            if (!phone) return alert("Masukkan nomor WhatsApp Anda!");

            const payBtn = document.getElementById('payBtn');
            payBtn.innerText = "Memproses...";
            payBtn.disabled = true;

            try {
                const response = await fetch(`/api/create-transaction`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart, phone })
                });

                const data = await response.json();
                if (data.success && data.payment_url) {
                    window.location.href = data.payment_url;
                } else alert(data.message || "Gagal membuat transaksi.");
            } catch (err) { alert("Gagal koneksi server."); }
            finally { payBtn.innerText = "Bayar Sekarang (Casaku)"; payBtn.disabled = false; }
        }

        document.getElementById('cartBtn').addEventListener('click', () => document.getElementById('cartModal').classList.remove('hidden'));
        document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartModal').classList.add('hidden'));

        renderProducts();
    </script>
</body>
  </html>
